<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Revit Sharing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--panel:#fff;--glass:rgba(255,255,255,.72);--side:rgba(255,255,255,.55);--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--hover:rgba(0,0,0,.05);--accent:#0071e3;--accent-bg:rgba(0,113,227,.12);--thumb:#f5f5f7;--g1:#06b6d4;--g2:#7c3aed;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);--blob1:rgba(34,211,238,.20);--blob2:rgba(139,92,246,.16);--blob3:rgba(37,99,235,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#1c1c1e;--glass:rgba(28,28,30,.72);--side:rgba(28,28,30,.55);--text:#f5f5f7;--muted:#98989d;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--hover:rgba(255,255,255,.06);--accent:#2997ff;--accent-bg:rgba(41,151,255,.18);--thumb:#e8e8ed;--g1:#7dd3fc;--g2:#60a5fa;--shadow:0 1px 2px rgba(0,0,0,.4);--blob1:rgba(34,211,238,.14);--blob2:rgba(139,92,246,.16);--blob3:rgba(37,99,235,.14)}}
:root[data-theme="dark"]{--bg:#000;--panel:#1c1c1e;--glass:rgba(28,28,30,.72);--side:rgba(28,28,30,.55);--text:#f5f5f7;--muted:#98989d;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--hover:rgba(255,255,255,.06);--accent:#2997ff;--accent-bg:rgba(41,151,255,.18);--thumb:#e8e8ed;--g1:#7dd3fc;--g2:#60a5fa;--shadow:0 1px 2px rgba(0,0,0,.4);--blob1:rgba(34,211,238,.14);--blob2:rgba(139,92,246,.16);--blob3:rgba(37,99,235,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;background-image:radial-gradient(900px 500px at 0% 0%,var(--blob1),transparent 60%),radial-gradient(800px 500px at 100% 10%,var(--blob2),transparent 60%),radial-gradient(900px 600px at 60% 110%,var(--blob3),transparent 60%);background-attachment:fixed}
header{position:relative;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;background:linear-gradient(90deg,#06b6d4,#2563eb 50%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{color:var(--muted);font-size:12px}
#q{flex:1 1 260px;min-width:0;padding:8px 14px;border:none;border-radius:10px;background:var(--fill);color:var(--text);font:inherit;outline:none;transition:box-shadow .15s}
#q:focus,select:focus{box-shadow:0 0 0 3px var(--accent-bg)}
select{padding:8px 12px;border:none;border-radius:10px;background:var(--fill);color:var(--text);font:inherit;outline:none}
.wrap{flex:1;display:flex;min-height:0}
aside{width:250px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
.node{display:flex;align-items:center;gap:4px;padding:5px 8px;margin:1px 0;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13px}
.node:hover{background:var(--hover)}
.node.on{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;font-weight:500;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;margin-right:4px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.card{border-top:3px solid var(--c,transparent)}
.tag{display:inline-flex;align-items:center;gap:5px;margin:0 10px 10px;padding:2px 8px;border-radius:980px;font-size:11px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);max-width:calc(100% - 20px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;align-self:flex-start}
.name{padding-bottom:6px!important}
.node.on .tg,.node.on .ct{color:rgba(255,255,255,.85)}
.node .tg{width:14px;text-align:center;color:var(--muted);flex:none;font-size:10px}
.node .lb{overflow:hidden;text-overflow:ellipsis;flex:1}
.node .ct{color:var(--muted);font-size:11px}
.kids{display:none}.kids.open{display:block}
main{flex:1;overflow:auto;padding:20px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:14px}
.card{background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.1)}
.thumb{aspect-ratio:1/1;background:var(--thumb);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.noimg{color:#8a8a8e;font-size:12px}
.name{padding:8px 10px 10px;font-size:12.5px;font-weight:500;word-break:break-word;line-height:1.3}
#more{display:block;margin:20px auto}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 0}
button,.btn{font:inherit;font-weight:500;padding:7px 16px;border:none;border-radius:980px;background:var(--fill);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{filter:brightness(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.3)}
.btn.off{opacity:.4;pointer-events:none}
dialog{border:none;border-radius:18px;padding:0;width:min(580px,94vw);background:var(--panel);color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh strong{word-break:break-word;font-size:16px;font-weight:600;letter-spacing:-.02em}
.dh button{width:30px;height:30px;padding:0;border-radius:50%}
.db{padding:18px;display:grid;grid-template-columns:200px 1fr;gap:18px}
.db .thumb{border-radius:12px}
table{border-collapse:collapse;font-size:13px;width:100%}
td{padding:4px 0;vertical-align:top;word-break:break-word}
td:first-child{color:var(--muted);padding-right:12px;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 18px}
#menuBtn{display:none}
#quote{position:relative;z-index:9;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding:9px 20px;text-align:center;font-size:14px;font-weight:500;letter-spacing:-.016em}
#quote .qt{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
#quote b{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
#banner{display:none}
#banner img{display:block;width:100%;border-radius:14px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
#sideBanner img{display:block;width:100%;border-radius:12px;margin:2px 0 12px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.grid{--cw:150px}
@media (max-width:760px){
  header{padding:10px 14px}
  main{padding:14px 16px}
  aside{position:fixed;inset:0 30% 0 0;z-index:20;display:none;box-shadow:0 0 40px rgba(0,0,0,.3);background:var(--panel)}
  aside.show{display:block}
  #menuBtn{display:inline-block}
  #banner{display:block}
  #sideBanner{display:none}
  .db{grid-template-columns:1fr}
  .db .thumb{max-width:220px;margin:0 auto;width:100%}
  .grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(calc(var(--cw)*.73),1fr))}
}
</style>
</head>
<body>
<header>
  <button id="menuBtn">☰ Thư mục</button>
  <h1 id="siteTitle">Family Revit Sharing</h1>
  <input id="q" type="search" placeholder="Tìm tên family (gõ không dấu cũng được)...">
  <select id="sort">
    <option value="name">Tên A→Z</option>
    <option value="new">Mới sửa gần đây</option>
  </select>
</header>
<div id="quote" hidden></div>
<div class="wrap">
  <aside id="side"><div id="sideBanner"></div><div id="tree"></div></aside>
  <main>
    <div id="banner"></div>
    <div class="top"><div class="meta" id="count"></div><div class="meta" id="meta"></div></div>
    <div class="grid" id="grid"></div>
    <button id="more">Xem thêm</button>
  </main>
</div>

<dialog id="dlg">
  <div class="dh"><strong id="dTitle"></strong><button onclick="dlg.close()" aria-label="Đóng">✕</button></div>
  <div class="db">
    <div class="thumb" id="dThumb"></div>
    <table id="dInfo"></table>
  </div>
  <div class="acts">
    <a class="btn primary" id="dDown" target="_blank" rel="noopener">⬇ Tải .rfa</a>
    <a class="btn" id="dFolder" target="_blank" rel="noopener">Mở thư mục trên Drive</a>
    <button id="dCopy">Copy tên file</button>
  </div>
  <div class="meta" id="dNote" style="padding:0 16px 14px"></div>
</dialog>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="links.js"></script>
<script>
const DATA = window.FAMILY_DATA || {families: []};
const LINKS = window.DRIVE_LINKS || null;
const fams = DATA.families;
const PAGE = 240;
const CFG = Object.assign({tieuDe: "Family Revit Sharing", banner: "", bannerCaoToiDa: 0, bannerRong: 50, mauChuDao: "",
  coAnh: "vua", sapXep: "ten", hienSoLuong: false, cauTruyenCamHung: []}, window.SITE_CONFIG || {});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[đĐ]/g, "d").toLowerCase();
const key = s => String(s ?? "").normalize("NFC").toLowerCase();

// map link Drive theo đường dẫn tương đối
const driveFiles = {}, driveFolders = {};
if (LINKS) {
  for (const k in LINKS.files) driveFiles[key(k)] = LINKS.files[k];
  for (const k in LINKS.folders) driveFolders[key(k)] = LINKS.folders[k];
}
fams.forEach(f => {
  f._s = norm(f.name + " " + f.folder);
  f._driveId = driveFiles[key(f.rel)] || "";
});

let curFolder = "", shown = 0, list = [];
// màu theo category cấp 1 (bảng màu hệ thống macOS)
const PALETTE = ["#007aff", "#ff9500", "#34c759", "#af52de", "#ff2d55", "#00c7be", "#5856d6", "#ff3b30", "#32ade6", "#ffb000", "#a2845e", "#30b0c7"];
const catColor = {};
[...new Set(fams.map(f => f.folder === "(goc)" ? "" : f.folder.split("/")[0]))].filter(Boolean)
  .sort((a, b) => a.localeCompare(b, "vi")).forEach((c, i) => catColor[c] = PALETTE[i % PALETTE.length]);
const colorOf = folder => catColor[String(folder).split("/")[0]] || "";

// ---------- cấu hình giao diện (config.js) ----------
function applyConfig() {
  document.title = CFG.tieuDe;
  $("siteTitle").textContent = CFG.tieuDe;
  if (CFG.mauChuDao) {
    const r = document.documentElement.style;
    r.setProperty("--accent", CFG.mauChuDao);
    r.setProperty("--accent-bg", `color-mix(in srgb, ${CFG.mauChuDao} 18%, transparent)`);
  }
  $("grid").style.setProperty("--cw", ({nho: "115px", vua: "150px", lon: "210px"})[CFG.coAnh] || "150px");
  $("sort").value = CFG.sapXep === "moi" ? "new" : "name";
  if (CFG.banner) {
    const img = document.createElement("img");
    img.src = CFG.banner; img.alt = "";
    if (CFG.bannerCaoToiDa > 0) { img.style.maxHeight = CFG.bannerCaoToiDa + "px"; img.style.objectFit = "cover"; }
    img.onerror = () => { $("banner").innerHTML = ""; $("sideBanner").innerHTML = ""; };
    $("banner").appendChild(img);
    $("sideBanner").appendChild(img.cloneNode());
  }
  const qs = (CFG.cauTruyenCamHung || []).filter(q => q && q[0]);
  if (qs.length) {
    const d = new Date();
    const day = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 0, 1)) / 864e5);
    const q = qs[((day % qs.length) + qs.length) % qs.length];
    $("quote").innerHTML = `<span class="qt">“${esc(q[0])}”</span>` + (q[1] ? `<b>— ${esc(q[1])}</b>` : "");
    $("quote").hidden = false;
  }
}

// ---------- cây thư mục ----------
function buildTree() {
  const root = {name: "Tất cả", path: "", kids: {}, n: 0};
  fams.forEach(f => {
    root.n++;
    if (f.folder === "(goc)") return;
    let node = root, acc = "";
    f.folder.split("/").forEach(part => {
      acc = acc ? acc + "/" + part : part;
      node = node.kids[part] ||= {name: part, path: acc, kids: {}, n: 0};
      node.n++;
    });
  });
  const html = (node, depth) => {
    const kids = Object.values(node.kids).sort((a, b) => a.name.localeCompare(b.name, "vi"));
    const has = kids.length > 0;
    return `<div class="node${node.path === curFolder ? " on" : ""}" data-path="${esc(node.path)}" style="padding-left:${10 + depth * 14}px">
        <span class="tg">${has ? (depth === 0 ? "▾" : "▸") : ""}</span>${depth === 1 ? `<span class="dot" style="--c:${colorOf(node.path)}"></span>` : ""}<span class="lb">${esc(node.name)}</span>${CFG.hienSoLuong ? `<span class="ct">${node.n}</span>` : ""}</div>
      ${has ? `<div class="kids${depth === 0 ? " open" : ""}">${kids.map(k => html(k, depth + 1)).join("")}</div>` : ""}`;
  };
  $("tree").innerHTML = html(root, 0);
}
$("tree").addEventListener("click", e => {
  const n = e.target.closest(".node"); if (!n) return;
  const kids = n.nextElementSibling;
  if (kids && kids.classList.contains("kids") && (e.target.classList.contains("tg") || n.dataset.path === curFolder)) {
    kids.classList.toggle("open");
    n.querySelector(".tg").textContent = kids.classList.contains("open") ? "▾" : "▸";
    if (n.dataset.path === curFolder) return;
  }
  curFolder = n.dataset.path;
  document.querySelectorAll(".node.on").forEach(x => x.classList.remove("on"));
  n.classList.add("on");
  if (kids && kids.classList.contains("kids") && !kids.classList.contains("open")) {
    kids.classList.add("open"); n.querySelector(".tg").textContent = "▾";
  }
  $("side").classList.remove("show");
  render();
});
$("menuBtn").onclick = () => $("side").classList.toggle("show");

// ---------- lưới ảnh ----------
function card(f) {
  const c = colorOf(f.folder), cat = f.folder.split("/")[0];
  return `<div class="card" data-id="${f.id}" title="${esc(f.rel)}"${c ? ` style="--c:${c}"` : ""}>
    <div class="thumb">${f.thumb ? `<img loading="lazy" src="${esc(f.thumb)}" alt="">` : '<span class="noimg">Không có ảnh</span>'}</div>
    <div class="name">${esc(f.name)}</div>${c ? `<span class="tag">${esc(cat)}</span>` : ""}</div>`;
}
function render() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  list = fams.filter(f =>
    (!curFolder || f.folder === curFolder || f.folder.startsWith(curFolder + "/")) &&
    words.every(w => f._s.includes(w)));
  if ($("sort").value === "name") list.sort((a, b) => a.name.localeCompare(b.name, "vi"));
  else list.sort((a, b) => b.mtime - a.mtime);
  $("count").textContent = (CFG.hienSoLuong ? `${list.length.toLocaleString("vi")} / ${fams.length.toLocaleString("vi")} family` + (curFolder ? " · " : "") : "") + (curFolder || "");
  shown = 0;
  $("grid").innerHTML = list.length ? "" : `<div class="empty">${fams.length ? "Không có family nào khớp." : "Chưa có dữ liệu (data.js). Hãy chạy nút Xuất Thư viện trong Revit."}</div>`;
  more();
}
function more() {
  $("grid").insertAdjacentHTML("beforeend", list.slice(shown, shown + PAGE).map(card).join(""));
  shown = Math.min(shown + PAGE, list.length);
  $("more").style.display = shown < list.length ? "block" : "none";
}
$("more").onclick = more;
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < list.length) more(); }, {rootMargin: "600px"}).observe($("more"));

// ---------- chi tiết ----------
function openFam(f) {
  $("dTitle").textContent = f.name;
  $("dThumb").innerHTML = f.thumb ? `<img src="${esc(f.thumb)}" alt="">` : '<span class="noimg">Không có ảnh</span>';
  $("dInfo").innerHTML = [["Thư mục", f.folder], ["File", f.rel.split("/").pop()], ["Dung lượng", f.size_kb.toLocaleString("vi") + " KB"], ["Sửa lần cuối", f.modified]]
    .map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("");
  const fid = f._driveId, folderId = driveFolders[key(f.folder === "(goc)" ? "" : f.folder)];
  $("dDown").href = fid ? `https://drive.google.com/uc?export=download&id=${fid}` : "#";
  $("dDown").classList.toggle("off", !fid);
  $("dFolder").href = folderId ? `https://drive.google.com/drive/folders/${folderId}` : "#";
  $("dFolder").classList.toggle("off", !folderId);
  $("dNote").textContent = !LINKS ? "Chưa có links.js nên chưa tải được từ Drive."
    : !fid ? "File này chưa có trên Drive (hoặc links.js chưa cập nhật)." : "";
  $("dCopy").textContent = "Copy tên file";
  $("dCopy").onclick = () => navigator.clipboard.writeText(f.rel.split("/").pop()).then(() => $("dCopy").textContent = "Đã copy ✓");
  history.replaceState(null, "", "#" + f.id);
  $("dlg").showModal();
}
$("dlg").addEventListener("close", () => history.replaceState(null, "", location.pathname + location.search));
$("grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) openFam(fams.find(f => f.id === c.dataset.id));
});

let t;
$("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 150); });
$("sort").addEventListener("change", render);

$("meta").textContent = fams.length ? `Cập nhật ${DATA.generated}` + (LINKS ? ` · Link Drive ${LINKS.generated}` : "") : "";
applyConfig();
buildTree();
render();
const h = location.hash.slice(1), hf = h && fams.find(f => f.id === h);
if (hf) openFam(hf);
</script>
</body>
</html>
